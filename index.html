<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>六年級國語｜生字拆解與注音打字高手 (L7-L12)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & Noto Serif TC for clear stroke rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
      overflow: hidden;
      touch-action: manipulation;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }
    /* Custom animations */
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
    /* Zhuyin Key Active Effect */
    .zhuyin-key {
      transition: transform 0.06s ease, box-shadow 0.06s ease, background-color 0.1s ease;
    }
    .zhuyin-key:active, .zhuyin-key.key-pressed {
      transform: translateY(3px) scale(0.97);
    }
    /* Custom Scrollbar for Modals */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between bg-slate-100 text-slate-800 select-none overflow-hidden">

  <!-- ================= TOP HEADER BAR (Compact for Tablet) ================= -->
  <header class="w-full bg-white border-b border-slate-200 px-3 py-1.5 flex flex-wrap items-center justify-between gap-2 shadow-sm z-20 shrink-0">
    <!-- Left: App Title & Lesson Selector -->
    <div class="flex items-center gap-2 flex-wrap">
      <div class="flex items-center gap-1.5 bg-indigo-600 text-white px-2.5 py-1 rounded-xl font-bold text-sm shadow-sm">
        <span>🧩</span>
        <span class="hidden sm:inline">六上生字</span>
        <span>拆字注音高手</span>
      </div>

      <!-- Lesson Dropdown -->
      <select id="lessonSelect" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-sm rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
        <option value="L7">第七課 (抉擇/蹣跚... 18字)</option>
        <option value="L8">第八課 (火焰/瞬間... 19字)</option>
        <option value="L9">第九課 (顛簸/鞏固... 19字)</option>
        <option value="L10">第十課 (傾聽/風靡... 18字)</option>
        <option value="L11">第十一課 (感激涕零/擤... 18字)</option>
        <option value="L12">第十二課 (拮据/囁嚅... 19字)</option>
        <option value="ALL">🌟 七～十二課 總複習隨機抽 (30題)</option>
        <option value="RADICAL">🎨 同部首家族特訓 (課本加底色生字)</option>
      </select>

      <!-- Mode Selector -->
      <div class="flex bg-slate-100 p-0.5 rounded-xl border border-slate-200">
        <button data-mode="1" class="mode-btn px-2.5 py-1 rounded-lg text-xs sm:text-sm font-bold transition bg-indigo-600 text-white shadow-sm" title="看拆字結構＋敲擊注音">
          🌱 觀察拆字
        </button>
        <button data-mode="2" class="mode-btn px-2.5 py-1 rounded-lg text-xs sm:text-sm font-bold transition text-slate-600 hover:text-slate-900" title="先挑出正確部件組字，再打注音">
          🧩 部件組裝
        </button>
        <button data-mode="3" class="mode-btn px-2.5 py-1 rounded-lg text-xs sm:text-sm font-bold transition text-slate-600 hover:text-slate-900" title="遮住生字本尊，看拆字公式猜字打音">
          🕵️ 拆字盲打
        </button>
      </div>
    </div>

    <!-- Right: Seat Selector, Mistake Bank, Stats & Controls -->
    <div class="flex items-center gap-2">
      <!-- Seat Selector -->
      <div class="flex items-center bg-slate-100 rounded-xl px-2 py-1 border border-slate-200 text-xs sm:text-sm">
        <span class="text-slate-500 font-medium mr-1">座號:</span>
        <select id="seatSelect" class="bg-transparent font-bold text-indigo-700 focus:outline-none cursor-pointer">
          <!-- Populated by JS 1-35 -->
        </select>
      </div>

      <!-- Mistake Review Button -->
      <button id="mistakeModeBtn" class="relative bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 transition">
        <span>🔥 錯字本</span>
        <span id="mistakeCountBadge" class="bg-rose-600 text-white text-xs px-1.5 py-0.2 rounded-full font-extrabold">0</span>
      </button>

      <!-- Dictionary / Overview Modal Button -->
      <button id="openDictBtn" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 transition" title="查看本課生字拆解總表">
        <span>📖 拆字圖鑑</span>
      </button>

      <!-- Sound Toggle -->
      <button id="soundToggleBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-1.5 rounded-xl border border-slate-200 text-sm" title="音效開關">
        🔊
      </button>
    </div>
  </header>

  <!-- ================= MIDDLE STAGE: CHARACTER & DECOMPOSITION WORKSPACE ================= -->
  <main class="flex-1 min-h-0 w-full max-w-6xl mx-auto px-3 py-1.5 flex flex-col justify-between gap-1.5 overflow-hidden">
    
    <!-- Progress & Score Strip -->
    <div class="w-full flex items-center justify-between gap-3 bg-white/80 backdrop-blur px-3 py-1 rounded-xl border border-slate-200/80 shrink-0">
      <div class="flex items-center gap-2 flex-1">
        <span id="progressText" class="text-xs sm:text-sm font-extrabold text-slate-700 whitespace-nowrap">進度 1 / 18</span>
        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: 5%;"></div>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs sm:text-sm font-bold shrink-0">
        <div class="flex items-center gap-1 text-amber-600 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-200">
          <span>⚡ 連擊</span>
          <span id="comboDisplay" class="font-black text-base">0</span>
        </div>
        <div class="flex items-center gap-1 text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-lg border border-indigo-200">
          <span>🏆 得分</span>
          <span id="scoreDisplay" class="font-black text-base">0</span>
        </div>
        <button id="skipBtn" class="text-xs text-slate-500 hover:text-indigo-600 underline font-semibold px-1">跳過此字</button>
      </div>
    </div>

    <!-- Main Interactive Card (Split Left: Target Character & Phrase | Right: Decomposition & Zhuyin Slots) -->
    <div id="questionCard" class="flex-1 min-h-0 bg-white rounded-2xl border-2 border-slate-200 shadow-sm p-2.5 sm:p-4 grid grid-cols-12 gap-3 items-center relative overflow-hidden">
      
      <!-- Left Column (Cols 4 on tablet/desktop, 5 on small): Target Character Box & Phrase -->
      <div class="col-span-5 sm:col-span-4 h-full flex flex-col items-center justify-center border-r border-slate-100 pr-2 relative">
        
        <!-- Lesson & Radical Family Badge -->
        <div class="w-full flex items-center justify-between gap-1 mb-1">
          <span id="charLessonTag" class="text-[11px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">第七課</span>
          <span id="radicalFamilyTag" class="hidden text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded-md animate-pulse">
            ★ 同部首家族：手部
          </span>
        </div>

        <!-- Huge Character Display (or Mystery Box in Mode 3) -->
        <div id="charBoxContainer" class="relative w-24 h-24 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-2xl bg-slate-50 border-2 border-slate-300 flex items-center justify-center shadow-inner my-0.5">
          <!-- Decorative米字格 lines -->
          <div class="absolute inset-0 pointer-events-none opacity-20">
            <div class="w-full h-1/2 border-b border-dashed border-rose-500"></div>
            <div class="h-full w-1/2 border-r border-dashed border-rose-500 absolute top-0 left-0"></div>
          </div>

          <span id="targetCharDisplay" class="font-serif-tc text-6xl sm:text-7xl md:text-8xl font-black text-slate-800 z-10 leading-none select-none">
            抉
          </span>
        </div>

        <!-- Example Phrase & Same-Radical Classmates -->
        <div class="mt-1 text-center">
          <div id="phraseDisplay" class="text-sm sm:text-base md:text-lg font-extrabold text-indigo-900 bg-indigo-50 px-3 py-0.5 rounded-xl border border-indigo-200 inline-block">
            語詞：【抉】擇
          </div>
          <div id="sameRadicalCousins" class="text-[11px] text-amber-700 font-semibold mt-0.5 hidden">
            同課家族：抉、擇、抽、搔
          </div>
        </div>
      </div>

      <!-- Right Column (Cols 7 on small, 8 on tablet): Decomposition Workshop & Active Zhuyin Input -->
      <div class="col-span-7 sm:col-span-8 h-full flex flex-col justify-between pl-1 overflow-y-auto">
        
        <!-- Top Section: Decomposition (拆字結構與積木) -->
        <div class="bg-slate-50 rounded-xl p-2 sm:p-3 border border-slate-200">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-extrabold uppercase tracking-wider bg-teal-600 text-white px-2 py-0.5 rounded-md" id="structureBadge">
                左右結構
              </span>
              <span id="decompInstruction" class="text-xs sm:text-sm font-bold text-slate-700">
                拆字記憶積木：
              </span>
            </div>
            <button id="hintBtn" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-2 py-0.5 rounded-lg border border-amber-300 transition">
              💡 偷看注音提示
            </button>
          </div>

          <!-- Decomposition Blocks Area (In Mode 1 & 3: Shows formula; In Mode 2: Shows interactive assembly slots + choices) -->
          <div id="decompArea" class="flex flex-wrap items-center gap-1.5 sm:gap-2 my-1 min-h-[42px]">
            <!-- Populated dynamically by JS -->
          </div>

          <!-- Memory Tip / Mnemonic -->
          <p id="memoryTipDisplay" class="text-xs sm:text-sm text-slate-600 font-medium bg-white px-2.5 py-1 rounded-lg border border-slate-200/80 mt-1">
            💡 記憶法：左邊提手旁，右邊是夬（決的右半邊）
          </p>
        </div>

        <!-- Bottom Section: Zhuyin Spelling Slots & Status Feedback -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-2 bg-indigo-50/70 rounded-xl p-2 sm:p-2.5 border border-indigo-100 mt-1">
          
          <div class="flex items-center gap-1.5">
            <span class="text-xs sm:text-sm font-extrabold text-indigo-900 mr-1">注音拼讀：</span>
            
            <!-- 4 Phonetic Slots: 聲母 / 介音 / 韻母 / 聲調 -->
            <div class="flex items-center gap-1.5">
              <div id="slotInitial" class="w-10 h-11 sm:w-12 sm:h-12 rounded-xl bg-white border-2 border-blue-300 flex flex-col items-center justify-center shadow-sm">
                <span class="text-[9px] text-blue-500 font-bold leading-none">聲母</span>
                <span class="slot-val text-lg sm:text-xl font-black text-blue-800 leading-tight mt-0.5"></span>
              </div>
              <div id="slotMedial" class="w-10 h-11 sm:w-12 sm:h-12 rounded-xl bg-white border-2 border-teal-300 flex flex-col items-center justify-center shadow-sm">
                <span class="text-[9px] text-teal-600 font-bold leading-none">介音</span>
                <span class="slot-val text-lg sm:text-xl font-black text-teal-800 leading-tight mt-0.5"></span>
              </div>
              <div id="slotFinal" class="w-10 h-11 sm:w-12 sm:h-12 rounded-xl bg-white border-2 border-indigo-300 flex flex-col items-center justify-center shadow-sm">
                <span class="text-[9px] text-indigo-500 font-bold leading-none">韻母</span>
                <span class="slot-val text-lg sm:text-xl font-black text-indigo-800 leading-tight mt-0.5"></span>
              </div>
              <div id="slotTone" class="w-10 h-11 sm:w-12 sm:h-12 rounded-xl bg-white border-2 border-amber-300 flex flex-col items-center justify-center shadow-sm">
                <span class="text-[9px] text-amber-600 font-bold leading-none">聲調</span>
                <span class="slot-val text-lg sm:text-xl font-black text-amber-700 leading-tight mt-0.5"></span>
              </div>
            </div>
          </div>

          <!-- Feedback Message & Quick Action -->
          <div id="feedbackBanner" class="text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shadow-sm text-center min-w-[160px]">
            請依序點擊下方注音與聲調送出
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- ================= BOTTOM WORKSPACE: BUILT-IN ZHUYIN KEYBOARD (52% Height) ================= -->
  <section id="keyboardSection" class="w-full h-[50vh] sm:h-[49vh] bg-slate-800 text-white p-1.5 sm:p-2.5 flex flex-col justify-between shadow-2xl z-20 shrink-0">
    <div class="w-full max-w-6xl mx-auto h-full flex flex-col justify-between gap-1 sm:gap-1.5">
      
      <!-- Top Legend & Tone Bar (聲調區 + 退格 + 確認送出) -->
      <div class="grid grid-cols-7 gap-1 sm:gap-1.5 h-[19%]">
        <button data-tone="1" class="tone-key zhuyin-key col-span-2 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black rounded-xl shadow-md border-b-4 border-amber-700 flex flex-col items-center justify-center leading-tight">
          <span class="text-sm sm:text-base">一聲 (陰平)</span>
          <span class="text-[10px] font-bold opacity-80">點此直接送出 (空白鍵)</span>
        </button>
        <button data-tone="ˊ" class="tone-key zhuyin-key bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl shadow-md border-b-4 border-amber-600 flex flex-col items-center justify-center">
          <span class="text-xl sm:text-2xl leading-none">ˊ</span>
          <span class="text-[10px] font-bold">二聲 (6)</span>
        </button>
        <button data-tone="ˇ" class="tone-key zhuyin-key bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl shadow-md border-b-4 border-amber-600 flex flex-col items-center justify-center">
          <span class="text-xl sm:text-2xl leading-none">ˇ</span>
          <span class="text-[10px] font-bold">三聲 (3)</span>
        </button>
        <button data-tone="ˋ" class="tone-key zhuyin-key bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl shadow-md border-b-4 border-amber-600 flex flex-col items-center justify-center">
          <span class="text-xl sm:text-2xl leading-none">ˋ</span>
          <span class="text-[10px] font-bold">四聲 (4)</span>
        </button>
        <button data-tone="˙" class="tone-key zhuyin-key bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl shadow-md border-b-4 border-amber-600 flex flex-col items-center justify-center">
          <span class="text-xl sm:text-2xl leading-none">˙</span>
          <span class="text-[10px] font-bold">輕聲 (7)</span>
        </button>
        <button id="backspaceKey" class="zhuyin-key bg-rose-600 hover:bg-rose-500 text-white font-black rounded-xl shadow-md border-b-4 border-rose-800 flex flex-col items-center justify-center">
          <span class="text-base sm:text-lg leading-none">⌫ 清除</span>
          <span class="text-[10px] font-normal opacity-80">重拼</span>
        </button>
      </div>

      <!-- Main Phonetic Keys Grid (4 Rows x 10 Columns Daqian Standard Layout) -->
      <div id="phoneticGrid" class="flex-1 grid grid-rows-4 gap-1 sm:gap-1.5">
        <!-- Row 1: ㄅ ㄉ ˇ(skip) -> Organized in standard left-to-right column order of Daqian keyboard so students build real muscle memory! -->
        <!-- Let's render via JS for clean data attributes & responsive styling -->
      </div>

    </div>
  </section>

  <!-- ================= MODAL 1: LESSON DICTIONARY & DECOMPOSITION TABLE (拆字圖鑑) ================= -->
  <div id="dictModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-6">
    <div class="bg-white w-full max-w-5xl max-h-[90vh] rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-pop">
      <div class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between">
        <div>
          <h2 class="text-lg sm:text-xl font-black flex items-center gap-2">
            <span>📖 生字部件拆解與同部首圖鑑</span>
            <span id="dictModalSubtitle" class="text-xs bg-indigo-800 px-2.5 py-0.5 rounded-full font-semibold">第七課</span>
          </h2>
          <p class="text-xs text-indigo-100 mt-0.5">點擊任一張生字卡，可直接跳轉練習該生字！標示黃底者為課本生字表「同部首家族」。</p>
        </div>
        <button id="closeDictBtn" class="bg-white/20 hover:bg-white/30 text-white rounded-xl px-3 py-1 font-bold text-sm">✕ 關閉</button>
      </div>
      
      <div id="dictGridContainer" class="p-4 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 bg-slate-50">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- ================= MODAL 2: COMPLETION CERTIFICATE (過關結算證書) ================= -->
  <div id="resultModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl border-4 border-amber-400 p-6 text-center animate-pop">
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-2 shadow-sm">
        🏅
      </div>
      <h2 class="text-2xl font-black text-slate-800">恭喜完成本回拆字注音挑戰！</h2>
      <p id="resultStudentInfo" class="text-sm font-bold text-indigo-600 mt-1">六年級 座號：1號 ｜ 第七課</p>

      <div class="grid grid-cols-3 gap-2 my-4 bg-slate-50 p-3 rounded-2xl border border-slate-200">
        <div>
          <div class="text-xs text-slate-500 font-bold">總得分</div>
          <div id="finalScoreVal" class="text-2xl font-black text-indigo-600">1800</div>
        </div>
        <div>
          <div class="text-xs text-slate-500 font-bold">最高連擊</div>
          <div id="finalComboVal" class="text-2xl font-black text-amber-600">18</div>
        </div>
        <div>
          <div class="text-xs text-slate-500 font-bold">待複習錯字</div>
          <div id="finalMistakeVal" class="text-2xl font-black text-rose-600">0</div>
        </div>
      </div>

      <div id="resultMistakeListWrapper" class="hidden text-left bg-rose-50 border border-rose-200 rounded-xl p-3 mb-4">
        <div class="text-xs font-extrabold text-rose-800 mb-1">📌 本回需要多留意的生字拆解：</div>
        <div id="resultMistakeList" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-2 mt-2">
        <button id="retryAllBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-xl shadow">
          🔄 再練一次本課
        </button>
        <button id="practiceMistakesFromModalBtn" class="hidden flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 px-4 rounded-xl shadow">
          🔥 立即專練錯字
        </button>
        <button id="closeResultModalBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-4 rounded-xl">
          關閉
        </button>
      </div>
    </div>
  </div>

  <!-- ================= APPLICATION JAVASCRIPT ================= -->
  <script>
    /*************************************************************************
     * 1. COMPLETE VOCABULARY & DECOMPOSITION DATABASE (Lessons 7 to 12)
     * Source: 115國小國語6上課本PDF_生字表 (Pages 3 & 4)
     * Every character uses normalized Zhuyin string + optional altZhuyin
     *************************************************************************/
    const VOCAB_DB = [
      // ==================== 第七課 (18字) ====================
      { lesson: 'L7', char: '抉', zhuyin: 'ㄐㄩㄝˊ', phrase: '【抉】擇', structure: '左右結構', parts: ['扌(手)', '夬'], radicalGroup: '手部', tip: '手部家族！左邊提手旁「扌」，右邊是「夬」（注意最後一筆是長捺，與決相同）。' },
      { lesson: 'L7', char: '擇', zhuyin: 'ㄗㄜˊ', phrase: '抉【擇】', structure: '左右結構', parts: ['扌(手)', '罒(橫目)', '幸'], radicalGroup: '手部', tip: '手部家族！用手挑選，左邊是「扌」，右邊是橫目「罒」加上幸福的「幸」。' },

    // Helper: Parse any Zhuyin string (e.g. 'ㄐㄩㄝˊ' or 'ㄔㄡ') into 4 slots: [聲母, 介音, 韻母, 聲調]
    const INITIALS_SET = new Set(['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ']);
    const MEDIALS_SET  = new Set(['ㄧ','ㄨ','ㄩ']);
    const FINALS_SET   = new Set(['ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ']);
    const TONES_SET    = new Set(['ˊ','ˇ','ˋ','˙','1','ˉ']);

    function parseZhuyinToSlots(zStr) {
      const slots = ['', '', '', '1']; // default tone is '1' (一聲)
      if (!zStr) return slots;
      for (const ch of zStr.trim()) {
        if (INITIALS_SET.has(ch)) slots[0] = ch;
        else if (MEDIALS_SET.has(ch)) slots[1] = ch;
        else if (FINALS_SET.has(ch)) slots[2] = ch;
        else if (TONES_SET.has(ch)) slots[3] = (ch === 'ˉ' || ch === '1') ? '1' : ch;
      }
      return slots;
    }

    function normalizeZhuyinSlots(slots) {
      const toneChar = (slots[3] === '1' || slots[3] === 'ˉ' || !slots[3]) ? '' : slots[3];
      return `${slots[0] || ''}${slots[1] || ''}${slots[2] || ''}${toneChar}`;
    }

    /*************************************************************************
     * 3. WEB AUDIO SYNTHESIZER (No external audio files needed)
     *************************************************************************/
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, type = 'sine', duration = 0.08, vol = 0.12) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      click() { this.playTone(520, 'triangle', 0.05, 0.1); }
      snap()  { this.playTone(680, 'sine', 0.07, 0.14); }
      success() {
        this.playTone(587.33, 'sine', 0.1, 0.15); // D5
        setTimeout(() => this.playTone(880, 'sine', 0.18, 0.18), 75); // A5
      }
      error() {
        this.playTone(220, 'sawtooth', 0.14, 0.12);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.18, 0.12), 90);
      }
    }
    const sfx = new SoundFX();

    /*************************************************************************
     * 4. APPLICATION STATE
     *************************************************************************/
    let state = {
      seat: '1',
      lesson: 'L7',
      mode: 1, // 1: 觀察拆字, 2: 部件組裝, 3: 拆字盲打
      isMistakeReview: false,
      queue: [],
      currentIndex: 0,
      score: 0,
      combo: 0,
      maxCombo: 0,
      sessionMistakes: new Set(),
      // Current character input state
      inputZhuyin: ['', '', '', ''], // [聲母, 介音, 韻母, 聲調]
      assembledParts: [], // Used in Mode 2
      mode2ReadyForZhuyin: false
    };

    // Load or save mistakes per seat in localStorage
    function getStoredMistakes(seat) {
      try {
        const raw = localStorage.getItem(`g6_vocab_mistakes_seat_${seat}`);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }
    function saveStoredMistakes(seat, charArray) {
      try {
        localStorage.setItem(`g6_vocab_mistakes_seat_${seat}`, JSON.stringify(charArray));
      } catch (e) {}
    }
    function addMistakeChar(charStr) {
      state.sessionMistakes.add(charStr);
      const list = getStoredMistakes(state.seat);
      if (!list.includes(charStr)) {
        list.push(charStr);
        saveStoredMistakes(state.seat, list);
      }
      updateMistakeBadge();
    }
    function removeMistakeChar(charStr) {
      const list = getStoredMistakes(state.seat).filter(c => c !== charStr);
      saveStoredMistakes(state.seat, list);
      updateMistakeBadge();
    }
    function updateMistakeBadge() {
      const list = getStoredMistakes(state.seat);
      const badge = document.getElementById('mistakeCountBadge');
      badge.textContent = list.length;
    }

    /*************************************************************************
     * 5. INITIALIZATION & UI RENDERING
     *************************************************************************/
    function initApp() {
      // 1. Populate Seat Selector (1 to 22 for the 22 students in class)
      const seatSelect = document.getElementById('seatSelect');
      seatSelect.innerHTML = '';
      for (let i = 1; i <= 22; i++) {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = `${i}號`;
        seatSelect.appendChild(opt);
      }
      let savedSeat = localStorage.getItem('g6_vocab_last_seat') || '1';
      if (parseInt(savedSeat, 10) > 22) savedSeat = '1';
      state.seat = savedSeat;
      seatSelect.value = savedSeat;

      // 2. Render On-Screen Zhuyin Keyboard
      renderKeyboard();

      // 3. Bind UI Events
      bindEvents();

      // 4. Start Lesson 7 by default
      updateMistakeBadge();
      loadQueue('L7', false);
    }

    function renderKeyboard() {
      const grid = document.getElementById('phoneticGrid');
      grid.innerHTML = '';

      KEYBOARD_ROWS.forEach((row) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'grid grid-cols-10 gap-1 sm:gap-1.5 h-full';

        row.forEach((item) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.sym = item.sym;
          btn.dataset.type = item.type;
          btn.dataset.key = item.key;

          // Color coding based on phonetic category
          let colorClass = '';
          let labelText = '';
          if (item.type === 'initial') {
            colorClass = 'bg-slate-700 hover:bg-slate-600 text-white border-slate-900';
            labelText = '聲';
          } else if (item.type === 'medial') {
            colorClass = 'bg-teal-600 hover:bg-teal-500 text-white border-teal-800';
            labelText = '介';
          } else {
            colorClass = 'bg-indigo-600 hover:bg-indigo-500 text-white border-indigo-800';
            labelText = '韻';
          }

          btn.className = `zhuyin-key ${colorClass} rounded-xl shadow border-b-4 flex flex-col items-center justify-center relative py-0.5`;
          btn.innerHTML = `

            <span class="text-[9px] sm:text-[10px] opacity-65 font-semibold mt-0.5">${labelText} (${item.key.toUpperCase()})</span>
          `;

          confirmBtn.innerHTML = `<span>✓ 一聲 / 確認送出</span>`;
          confirmBtn.addEventListener('click', () => handleToneInput('1'));
          rowEl.appendChild(confirmBtn);
        }

        grid.appendChild(rowEl);
      });

    /*************************************************************************
     * 6. QUEUE & QUESTION LOADING
     *************************************************************************/
    function loadQueue(lessonKey, isMistakeMode = false) {
      state.isMistakeReview = isMistakeMode;
      state.lesson = lessonKey;
      state.currentIndex = 0;
      state.score = 0;
      state.combo = 0;
      state.maxCombo = 0;
      state.sessionMistakes.clear();

      let pool = [];
      if (isMistakeMode) {
        const mistakeChars = getStoredMistakes(state.seat);
        pool = VOCAB_DB.filter(item => mistakeChars.includes(item.char));
        if (pool.length === 0) {
          setFeedback('🎉 太棒了！目前錯字本沒有生字，已為你載入本課練習。', 'emerald');
          state.isMistakeReview = false;
        }
      }

      if (!state.isMistakeReview) {
        if (lessonKey === 'ALL') {
          pool = [...VOCAB_DB].sort(() => Math.random() - 0.5).slice(0, 30);
        } else if (lessonKey === 'RADICAL') {
          pool = VOCAB_DB.filter(item => item.radicalGroup !== null);
        } else {
          pool = VOCAB_DB.filter(item => item.lesson === lessonKey);
        }
      }

      state.queue = pool;
      updateScoreBoard();
      renderCurrentQuestion();
    }

    function getCurrentItem() {
      return state.queue[state.currentIndex];
    }

    function renderCurrentQuestion() {
      const item = getCurrentItem();
      if (!item) return;

      // Reset current input state
      state.inputZhuyin = ['', '', '', ''];
      state.assembledParts = [];
      state.mode2ReadyForZhuyin = (state.mode !== 2);
      updateZhuyinSlotsUI();

      // Lesson Tag
      const lessonNames = { L7: '第七課', L8: '第八課', L9: '第九課', L10: '第十課', L11: '第十一課', L12: '第十二課' };
      document.getElementById('charLessonTag').textContent = state.isMistakeReview
        ? `🔥 錯字重練 (${lessonNames[item.lesson]})`
        : lessonNames[item.lesson];

      // Radical Family Tag & Cousins
      const radTag = document.getElementById('radicalFamilyTag');
      const radCousins = document.getElementById('sameRadicalCousins');
      if (item.radicalGroup) {
        radTag.textContent = `★ 同部首：${item.radicalGroup}`;
        radTag.classList.remove('hidden');
        // Find cousins in same lesson
        const cousins = VOCAB_DB
          .filter(v => v.lesson === item.lesson && v.radicalGroup === item.radicalGroup)
          .map(v => v.char)
          .join('、');
        radCousins.textContent = `本課${item.radicalGroup}家族：${cousins}`;
        radCousins.classList.remove('hidden');
      } else {
        radTag.classList.add('hidden');
        radCousins.classList.add('hidden');
      }

      // Target Character & Phrase (Handle Mode 3 Mystery Mask)
      const charDisplay = document.getElementById('targetCharDisplay');
      const phraseDisplay = document.getElementById('phraseDisplay');
      const charBox = document.getElementById('charBoxContainer');

      if (state.mode === 3) {
        charDisplay.textContent = '？';
        charDisplay.className = 'font-serif-tc text-6xl sm:text-7xl md:text-8xl font-black text-amber-500 z-10 leading-none select-none';
        phraseDisplay.textContent = `語詞：${item.phrase.replace(item.char, ' ？ ')}`;
      } else {
        charDisplay.textContent = item.char;
        charDisplay.className = 'font-serif-tc text-6xl sm:text-7xl md:text-8xl font-black text-slate-800 z-10 leading-none select-none animate-pop';
        phraseDisplay.textContent = `語詞：${item.phrase}`;
      }

      // Highlight box if radical group
      if (item.radicalGroup) {
        charBox.className = 'relative w-24 h-24 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-2xl bg-amber-50/70 border-2 border-amber-400 flex items-center justify-center shadow-inner my-0.5';
      } else {
        charBox.className = 'relative w-24 h-24 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-2xl bg-slate-50 border-2 border-slate-300 flex items-center justify-center shadow-inner my-0.5';
      }

      // Structure Badge & Tip
      document.getElementById('structureBadge').textContent = item.structure;
      document.getElementById('memoryTipDisplay').textContent = `💡 拆字記憶：${item.tip}`;

      // Render Decomposition Area according to Mode
      renderDecompositionArea(item);

      // Update Progress Bar
      const total = state.queue.length;
      const current = state.currentIndex + 1;
      document.getElementById('progressText').textContent = `進度 ${current} / ${total}`;
      document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;

      if (state.mode === 2) {
        setFeedback('🧩 第1步：請先點擊上方正確的「部件積木」組裝生字！', 'amber');
      } else if (state.mode === 3) {
        setFeedback('🕵️ 看部件公式猜生字，並敲擊下方注音與聲調揭曉！', 'indigo');
      } else {
        setFeedback('請觀察拆字結構，並點擊下方注音與聲調送出', 'slate');
      }
    }

    /*************************************************************************
     * 7. DECOMPOSITION AREA RENDERING (Mode 1/3 vs Mode 2 Interactive Assembly)
     *************************************************************************/
    function renderDecompositionArea(item) {
      const container = document.getElementById('decompArea');
      const instruction = document.getElementById('decompInstruction');
      container.innerHTML = '';

      if (state.mode === 1 || state.mode === 3) {
        instruction.textContent = '部件拆解公式：';
        // Show clean visual formula: [Part 1] + [Part 2] = [Char]
        item.parts.forEach((part, idx) => {
          const badge = document.createElement('div');
          badge.className = 'bg-white border-2 border-indigo-300 text-indigo-900 font-black px-3 py-1 rounded-xl text-sm sm:text-base shadow-sm flex items-center gap-1 animate-pop';
          badge.innerHTML = `<span class="text-xs text-indigo-400 font-bold">部件${idx + 1}</span> <span>${part}</span>`;
          container.appendChild(badge);

          if (idx < item.parts.length - 1) {
            const plus = document.createElement('span');
            plus.className = 'text-slate-400 font-black text-lg';
            plus.textContent = '＋';
            container.appendChild(plus);
          }
        });
      } else if (state.mode === 2) {
        // Mode 2: Interactive Component Assembly!
        instruction.textContent = `請依序選出 ${item.parts.length} 個正確部件組裝：`;

        // 1. Target Slots row
        const slotsWrap = document.createElement('div');
        slotsWrap.className = 'flex items-center gap-1.5 mr-3';
        item.parts.forEach((part, idx) => {
          const filled = state.assembledParts[idx];
          const slotEl = document.createElement('div');
          if (filled) {
            slotEl.className = 'bg-emerald-600 text-white font-black px-2.5 py-1 rounded-xl text-xs sm:text-sm shadow-sm animate-pop';
            slotEl.textContent = `✓ ${filled}`;
          } else {
            slotEl.className = 'bg-white border-2 border-dashed border-amber-400 text-amber-700 font-bold px-2.5 py-1 rounded-xl text-xs sm:text-sm';
            slotEl.textContent = `部件 ${idx + 1} ?`;
          }
          slotsWrap.appendChild(slotEl);
        });
        container.appendChild(slotsWrap);

        // 2. If not yet completed assembly, show shuffled candidate buttons
        if (!state.mode2ReadyForZhuyin) {
          if (!item._shuffledChoices) {
            const distractors = DISTRACTOR_PARTS
              .filter(d => !item.parts.includes(d))
              .sort(() => Math.random() - 0.5)
              .slice(0, 2);
            item._shuffledChoices = [...item.parts, ...distractors].sort(() => Math.random() - 0.5);
          }

          const choicesWrap = document.createElement('div');
          choicesWrap.className = 'flex flex-wrap items-center gap-1.5';
          item._shuffledChoices.forEach((choice) => {
            // Check how many times already picked
            const alreadyPicked = state.assembledParts.includes(choice) &&
              item.parts.filter(p => p === choice).length <= state.assembledParts.filter(p => p === choice).length;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.disabled = alreadyPicked;
            btn.className = alreadyPicked
              ? 'bg-slate-200 text-slate-400 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold cursor-not-allowed'
              : 'bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold shadow cursor-pointer transition';
            btn.textContent = choice;
            btn.addEventListener('click', () => handleComponentPick(choice, item));
            choicesWrap.appendChild(btn);
          });
          container.appendChild(choicesWrap);
        } else {
          const doneTag = document.createElement('span');
          doneTag.className = 'text-xs sm:text-sm font-extrabold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-xl border border-emerald-300';
          doneTag.textContent = '🎉 部件組裝完成！現在請敲擊下方注音！';
          container.appendChild(doneTag);
        }
      }
    }

    function handleComponentPick(choice, item) {
      const nextNeededIndex = state.assembledParts.length;
      const expectedPart = item.parts[nextNeededIndex];

      // Allow selecting parts in order OR any remaining valid part of this character
      const remainingValidParts = [...item.parts];
      state.assembledParts.forEach(p => {
        const idx = remainingValidParts.indexOf(p);
        if (idx !== -1) remainingValidParts.splice(idx, 1);
      });

      if (choice === expectedPart || remainingValidParts.includes(choice)) {
        sfx.snap();
        // Put in next slot
        state.assembledParts.push(choice);
        if (state.assembledParts.length === item.parts.length) {
          state.mode2ReadyForZhuyin = true;
          // Normalize order for clean display
          state.assembledParts = [...item.parts];
          setFeedback('✅ 拆字組裝正確！第2步：請點擊下方注音與聲調！', 'emerald');
        }
        renderDecompositionArea(item);
      } else {
        sfx.error();
        addMistakeChar(item.char);
        state.combo = 0;
        updateScoreBoard();
        setFeedback(`❌ 「${choice}」不是這個字的部件喔，再仔細看一次！`, 'rose');
        const card = document.getElementById('questionCard');
        card.classList.remove('animate-shake');
        void card.offsetWidth;
        card.classList.add('animate-shake');
      }
    }

    /*************************************************************************
     * 8. ZHUYIN INPUT & VALIDATION LOGIC
     *************************************************************************/
    function handlePhoneticInput(sym, type) {
      const item = getCurrentItem();
      if (!item) return;

      // In Mode 2, require component assembly first
      if (state.mode === 2 && !state.mode2ReadyForZhuyin) {
        sfx.error();
        setFeedback('⚠️ 請先點擊上方的「部件積木」完成組字，再打注音喔！', 'amber');
        return;
      }

      sfx.click();
      if (type === 'initial') {
        state.inputZhuyin[0] = (state.inputZhuyin[0] === sym) ? '' : sym;
      } else if (type === 'medial') {
        state.inputZhuyin[1] = (state.inputZhuyin[1] === sym) ? '' : sym;
      } else if (type === 'final') {
        state.inputZhuyin[2] = (state.inputZhuyin[2] === sym) ? '' : sym;
      }
      updateZhuyinSlotsUI();
    }

    function handleToneInput(toneSym) {
      const item = getCurrentItem();
      if (!item) return;

      if (state.mode === 2 && !state.mode2ReadyForZhuyin) {
        sfx.error();
        setFeedback('⚠️ 請先點擊上方的「部件積木」完成組字，再打注音喔！', 'amber');
        return;
      }

      state.inputZhuyin[3] = toneSym;
      updateZhuyinSlotsUI();
      validateZhuyinSubmission();
    }

    function clearZhuyinInput() {
      sfx.click();
      state.inputZhuyin = ['', '', '', ''];
      updateZhuyinSlotsUI();
    }

    function updateZhuyinSlotsUI() {
      const ids = ['slotInitial', 'slotMedial', 'slotFinal', 'slotTone'];
      ids.forEach((id, idx) => {
        const el = document.getElementById(id).querySelector('.slot-val');
        const val = state.inputZhuyin[idx];
        el.textContent = val === '1' ? '—' : val;
      });
    }

    function validateZhuyinSubmission() {
      const item = getCurrentItem();
      if (!item) return;

      // Normalize student's input slots & compare against primary zhuyin and any altZhuyin
      const actualNormalized = normalizeZhuyinSlots(state.inputZhuyin);
      const validTargets = [item.zhuyin, ...(item.altZhuyin || [])].map(z =>
        normalizeZhuyinSlots(parseZhuyinToSlots(z))
      );

      // Make sure student entered at least one phonetic symbol before submitting
      if (!state.inputZhuyin[0] && !state.inputZhuyin[1] && !state.inputZhuyin[2]) {
        sfx.error();
        setFeedback('⚠️ 請先點擊下方的「注音符號」，最後再點選聲調送出喔！', 'amber');
        state.inputZhuyin[3] = '';
        updateZhuyinSlotsUI();
        return;
      }

      const isCorrect = validTargets.includes(actualNormalized);

      if (isCorrect) {
        sfx.success();
        state.combo += 1;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;
        state.score += 100 + Math.min(state.combo * 10, 100);

        // If practicing in Mistake Review Mode and got it right, remove from stored mistakes
        if (state.isMistakeReview) {
          removeMistakeChar(item.char);
        }

        updateScoreBoard();

        // If Mode 3, reveal character with celebration!
        if (state.mode === 3) {
          const charDisplay = document.getElementById('targetCharDisplay');
          charDisplay.textContent = item.char;
          charDisplay.className = 'font-serif-tc text-6xl sm:text-7xl md:text-8xl font-black text-emerald-600 z-10 leading-none select-none animate-pop';
          document.getElementById('phraseDisplay').textContent = `語詞：${item.phrase}`;
        }

        const displayExpected = formatZhuyinString(item.zhuyin);
        setFeedback(`🎉 答對了！「${item.char}」讀作 ${displayExpected}`, 'emerald');

        // Advance to next character after short pause
        setTimeout(() => {
          if (state.currentIndex + 1 < state.queue.length) {
            state.currentIndex += 1;
            renderCurrentQuestion();
          } else {
            showCompletionModal();
          }
        }, 550);
      } else {
        sfx.error();
        state.combo = 0;
        addMistakeChar(item.char);
        updateScoreBoard();

        // Diagnose which slot differed from primary target to give clear feedback
        const expectedSlots = parseZhuyinToSlots(item.zhuyin);
        const actual = state.inputZhuyin;
        const typedStr = actualNormalized || '(未輸入)';

        let partError = '再仔細拼一次喔！';
        if (actual[0] !== expectedSlots[0]) {
          partError = expectedSlots[0] ? `「聲母」不太對喔（應有聲母）` : `這個字沒有「聲母」喔！`;
        } else if (actual[1] !== expectedSlots[1]) {
          partError = expectedSlots[1] ? `別漏掉或按錯「介音 (ㄧㄨㄩ)」喔！` : `這個字不需要「介音 (ㄧㄨㄩ)」喔！`;
        } else if (actual[2] !== expectedSlots[2]) {
          partError = expectedSlots[2] ? `「韻母」位置不對或漏掉囉！` : `這個字不需要「韻母」喔！`;
        } else if (actual[3] !== expectedSlots[3]) {
          partError = `注音拼對了，但「聲調」選錯囉！`;
        }

        setFeedback(`❌ 你輸入了「${typedStr}」— ${partError}`, 'rose');

        const card = document.getElementById('questionCard');
        card.classList.remove('animate-shake');
        void card.offsetWidth;
        card.classList.add('animate-shake');

        // Reset tone slot after brief moment so student can adjust easily
        setTimeout(() => {
          state.inputZhuyin[3] = '';
          updateZhuyinSlotsUI();
        }, 350);
      }
    }

    function formatZhuyinString(zInput) {
      if (Array.isArray(zInput)) {
        return normalizeZhuyinSlots(zInput);
      }
      return normalizeZhuyinSlots(parseZhuyinToSlots(zInput));
    }

    function setFeedback(text, color = 'slate') {
      const banner = document.getElementById('feedbackBanner');
      const styles = {
        slate: 'bg-white text-slate-700 border-slate-200',
        emerald: 'bg-emerald-600 text-white border-emerald-700 shadow',
        rose: 'bg-rose-600 text-white border-rose-700 shadow',
        amber: 'bg-amber-100 text-amber-900 border-amber-300',
        indigo: 'bg-indigo-100 text-indigo-900 border-indigo-300'
      };
      banner.className = `text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl border text-center min-w-[180px] transition-all ${styles[color] || styles.slate}`;
      banner.textContent = text;
    }

    function updateScoreBoard() {
      document.getElementById('scoreDisplay').textContent = state.score;
      document.getElementById('comboDisplay').textContent = state.combo;
    }

    /*************************************************************************
     * 9. MODALS: DICTIONARY OVERVIEW & COMPLETION CERTIFICATE
     *************************************************************************/
    function openDictionaryModal() {
      const modal = document.getElementById('dictModal');
      const grid = document.getElementById('dictGridContainer');
      const subtitle = document.getElementById('dictModalSubtitle');
      grid.innerHTML = '';

      const lessonKey = state.lesson;
      const lessonNames = {
        L7: '第七課', L8: '第八課', L9: '第九課', L10: '第十課', L11: '第十一課', L12: '第十二課',
        ALL: '七～十二課全覽', RADICAL: '同部首家族特訓'
      };
      subtitle.textContent = lessonNames[lessonKey] || '生字表';

      const list = (lessonKey === 'ALL')
        ? VOCAB_DB
        : (lessonKey === 'RADICAL')
          ? VOCAB_DB.filter(v => v.radicalGroup !== null)
          : VOCAB_DB.filter(v => v.lesson === lessonKey);

      list.forEach((item) => {
        const card = document.createElement('div');
        const isRadical = item.radicalGroup !== null;
        card.className = `${isRadical ? 'bg-amber-50/90 border-amber-300' : 'bg-white border-slate-200'} border-2 rounded-2xl p-3 shadow-sm hover:shadow-md hover:border-indigo-400 transition cursor-pointer flex flex-col justify-between gap-2`;
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <div class="w-12 h-12 rounded-xl bg-slate-100 border border-slate-300 flex items-center justify-center font-serif-tc text-3xl font-black text-slate-800 shrink-0">
                ${item.char}
              </div>
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-base font-black text-indigo-700">${formatZhuyinString(item.zhuyin)}</span>
                  <span class="text-[11px] bg-teal-100 text-teal-800 font-bold px-1.5 py-0.5 rounded">${item.structure}</span>
                </div>
                <div class="text-xs font-bold text-slate-600 mt-0.5">${item.phrase}</div>
              </div>
            </div>
            ${isRadical ? `<span class="text-[10px] font-extrabold bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">★ ${item.radicalGroup}</span>` : ''}
          </div>
          <div class="flex flex-wrap items-center gap-1 bg-slate-100/80 p-1.5 rounded-lg">
            <span class="text-[11px] font-bold text-slate-500">拆字：</span>
            ${item.parts.map(p => `<span class="text-xs font-extrabold bg-white border border-indigo-200 text-indigo-900 px-2 py-0.5 rounded-md">${p}</span>`).join('<span class="text-slate-400 font-bold">+</span>')}
          </div>
          <p class="text-[11px] text-slate-600 leading-snug">${item.tip}</p>
        `;

        card.addEventListener('click', () => {
          modal.classList.add('hidden');
          // Jump to this character in current queue if present
          const idx = state.queue.findIndex(q => q.char === item.char);
          if (idx !== -1) {
            state.currentIndex = idx;
            renderCurrentQuestion();
          }
        });
        grid.appendChild(card);
      });

      modal.classList.remove('hidden');
    }

    function showCompletionModal() {
      const modal = document.getElementById('resultModal');
      const lessonSelect = document.getElementById('lessonSelect');
      const lessonLabel = lessonSelect.options[lessonSelect.selectedIndex].text.split(' ')[0];

      document.getElementById('resultStudentInfo').textContent =
        `六年級 座號：${state.seat}號 ｜ ${state.isMistakeReview ? '錯字專練' : lessonLabel}`;
      document.getElementById('finalScoreVal').textContent = state.score;
      document.getElementById('finalComboVal').textContent = state.maxCombo;

      const mistakesArr = Array.from(state.sessionMistakes);
      document.getElementById('finalMistakeVal').textContent = mistakesArr.length;

      const listWrapper = document.getElementById('resultMistakeListWrapper');
      const listEl = document.getElementById('resultMistakeList');
      const practiceMistakesBtn = document.getElementById('practiceMistakesFromModalBtn');

      if (mistakesArr.length > 0) {
        listWrapper.classList.remove('hidden');
        practiceMistakesBtn.classList.remove('hidden');
        listEl.innerHTML = mistakesArr.map(ch => {
          const info = VOCAB_DB.find(v => v.char === ch);
          return `<span class="bg-white border border-rose-300 text-rose-900 font-bold text-xs px-2.5 py-1 rounded-lg">${ch} (${info ? info.parts.join('+') : ''})</span>`;
        }).join('');
      } else {
        listWrapper.classList.add('hidden');
        practiceMistakesBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    /*************************************************************************
     * 10. EVENT BINDINGS & PHYSICAL KEYBOARD SUPPORT
     *************************************************************************/
    function bindEvents() {
      // Lesson Selector
      document.getElementById('lessonSelect').addEventListener('change', (e) => {
        loadQueue(e.target.value, false);
      });

      // Seat Selector
      document.getElementById('seatSelect').addEventListener('change', (e) => {
        state.seat = e.target.value;
        localStorage.setItem('g6_vocab_last_seat', state.seat);
        updateMistakeBadge();
      });

      // Mode Buttons (1, 2, 3)
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          sfx.click();
          state.mode = parseInt(btn.dataset.mode, 10);
          document.querySelectorAll('.mode-btn').forEach(b => {
            b.className = 'mode-btn px-2.5 py-1 rounded-lg text-xs sm:text-sm font-bold transition text-slate-600 hover:text-slate-900';
          });
          btn.className = 'mode-btn px-2.5 py-1 rounded-lg text-xs sm:text-sm font-bold transition bg-indigo-600 text-white shadow-sm';
          renderCurrentQuestion();
        });
      });

      // Tone Keys
      document.querySelectorAll('.tone-key').forEach((btn) => {
        btn.addEventListener('click', () => {
          handleToneInput(btn.dataset.tone);
        });
      });

      // Backspace / Clear Key
      document.getElementById('backspaceKey').addEventListener('click', clearZhuyinInput);

      // Hint Button
      document.getElementById('hintBtn').addEventListener('click', () => {
        const item = getCurrentItem();
        if (!item) return;
        sfx.click();
        addMistakeChar(item.char); // Mark for review if hint needed
        const zStr = formatZhuyinString(item.zhuyin);
        setFeedback(`💡 提示：「${item.char}」的注音是 【 ${zStr} 】`, 'amber');
      });

      // Skip Button
      document.getElementById('skipBtn').addEventListener('click', () => {
        sfx.click();
        if (state.currentIndex + 1 < state.queue.length) {
          state.currentIndex += 1;
          renderCurrentQuestion();
        } else {
          showCompletionModal();
        }
      });

      // Mistake Review Mode Button
      document.getElementById('mistakeModeBtn').addEventListener('click', () => {
        sfx.click();
        const list = getStoredMistakes(state.seat);
        if (list.length === 0) {
          setFeedback('👏 目前座號沒有錯字紀錄喔！繼續保持！', 'emerald');
          return;
        }
        loadQueue(state.lesson, true);
      });

      // Dictionary Modal
      document.getElementById('openDictBtn').addEventListener('click', () => {
        sfx.click();
        openDictionaryModal();
      });
      document.getElementById('closeDictBtn').addEventListener('click', () => {
        document.getElementById('dictModal').classList.add('hidden');
      });

      // Result Modal Buttons
      document.getElementById('retryAllBtn').addEventListener('click', () => {
        document.getElementById('resultModal').classList.add('hidden');
        loadQueue(state.lesson, false);
      });
      document.getElementById('practiceMistakesFromModalBtn').addEventListener('click', () => {
        document.getElementById('resultModal').classList.add('hidden');
        loadQueue(state.lesson, true);
      });
      document.getElementById('closeResultModalBtn').addEventListener('click', () => {
        document.getElementById('resultModal').classList.add('hidden');
      });

      // Sound Toggle
      document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
        sfx.enabled = !sfx.enabled;
        e.currentTarget.textContent = sfx.enabled ? '🔊' : '🔇';
      });

      // Physical Keyboard Support (Standard Taiwanese Daqian Layout)
      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        const k = e.key.toLowerCase();

        if (k === 'backspace' || k === 'escape') {
          e.preventDefault();
          clearZhuyinInput();
          return;
        }
        if (k === ' ' || k === 'enter') {
          e.preventDefault();
          handleToneInput('1');
          return;
        }
        const toneMap = { '6': 'ˊ', '3': 'ˇ', '4': 'ˋ', '7': '˙' };
        if (toneMap[k]) {
          e.preventDefault();
          handleToneInput(toneMap[k]);
          return;
        }

        // Check phonetic keys
        for (const row of KEYBOARD_ROWS) {
          const found = row.find(item => item.key === k);
          if (found) {
            e.preventDefault();
            handlePhoneticInput(found.sym, found.type);
            break;
          }
        }
      });
    }

    window.onload = initApp;
  </script>
